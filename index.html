const TX={"routes":[{"es":"Ruta completa","eu":"Ibilbide osoa","en":"Full route"},{"es":"Anillo verde y embalses","eu":"Eraztun Berdea eta urtegiak","en":"Green Belt and reservoirs"},{"es":"Alsasua, Urbasa y Vasco Navarro","eu":"Altsasu, Urbasa eta Euskal-Nafar Trenbidea","en":"Alsasua, Urbasa and the Basque-Navarrese Railway"},{"es":"Santa Cruz, Rioja Alavesa y Vasco Navarro","eu":"Santikurutze Kanpezu, Arabako Errioxa eta Euskal-Nafar Trenbidea","en":"Santa Cruz, Rioja Alavesa and the Basque-Navarrese Railway"},{"es":"La Rioja, Miranda y Treviño","eu":"Errioxa, Miranda eta Trebiñu","en":"La Rioja, Miranda and Treviño"},{"es":"Salinas, Miranda y salto del Nervión","eu":"Gesaltza, Miranda eta Nerbioiko ur-jauzia","en":"Salinas, Miranda and the Nervión waterfall"}],"pn":{"eu":{"Laguardia":"Biasteri","Labastida":"Bastida","Alsasua":"Altsasu","Orduña":"Urduña","Treviño":"Trebiñu","Salinas de Añana":"Gesaltza Añana","Villarreal de Álava":"Legutio","Santa Cruz de Campezo":"Santikurutze Kanpezu","Agurain/Salvatierra":"Agurain"},"en":{"Alsasua":"Altsasu/Alsasua"}},"info":{"0":{"d":{"es":"La ruta completa recorre en una sola vuelta los paisajes de los cinco sectores: del Anillo Verde y los embalses de Vitoria-Gasteiz a las sierras del norte de Navarra, la Rioja Alavesa, el valle del Ebro y el Salto del Nervión. Pensada para hacerla en varios días, con parada en pueblos.","eu":"Ibilbide osoak bost sektoreen paisaiak biltzen ditu itzuli bakarrean: Gasteizko Eraztun Berdetik eta urtegietatik Nafarroako mendietara, Arabako Errioxara, Ebro haranera eta Nerbioiko ur-jauzira. Egun batzuetan egiteko pentsatuta dago, herrietan geldialdiak eginez.","en":"The full route covers in a single loop the landscapes of all five sectors: from Vitoria-Gasteiz's Green Belt and reservoirs to the mountains of Navarre, the Rioja Alavesa, the Ebro valley and the Nervión waterfall. It is designed to be ridden over several days, with stops in villages."},"see":{"es":["Anillo Verde y embalses de Vitoria-Gasteiz","Sierra de Urbasa y Vía Verde del Ferrocarril Vasco Navarro","Laguardia y la Rioja Alavesa","Miranda de Ebro y el Condado de Treviño","Valle Salado de Añana y Salto del Nervión"],"eu":["Gasteizko Eraztun Berdea eta urtegiak","Urbasako mendilerroa eta Euskal-Nafar Trenbidearen Bide Berdea","Biasteri eta Arabako Errioxa","Miranda de Ebro eta Trebiñuko Konderria","Añanako Gatz Harana eta Nerbioiko ur-jauzia"],"en":["Vitoria-Gasteiz Green Belt and reservoirs","Sierra de Urbasa and the Basque-Navarrese Railway Greenway","Laguardia and the Rioja Alavesa","Miranda de Ebro and the Condado de Treviño","Añana Salt Valley and the Nervión waterfall"]}},"1":{"d":{"es":"Un sector corto y de desnivel suave, ideal como primer contacto con GRAVARABA500: rodea Vitoria-Gasteiz por el Anillo Verde y se asoma a los embalses del Zadorra.","eu":"Sektore laburra eta maldak leunekoa, GRAVARABA500 ezagutzen hasteko ezin hobea: Gasteiz inguratzen du Eraztun Berdetik eta Zadorra ibaiko urtegietara hurbiltzen da.","en":"A short sector with gentle climbing, ideal as a first taste of GRAVARABA500: it circles Vitoria-Gasteiz along the Green Belt and reaches the Zadorra reservoirs."},"see":{"es":["Anillo Verde de Vitoria-Gasteiz","Embalse de Ullíbarri-Gamboa","Embalse de Urrunaga"],"eu":["Gasteizko Eraztun Berdea","Ullibarri-Ganboako urtegia","Urrunagako urtegia"],"en":["Vitoria-Gasteiz Green Belt","Ullíbarri-Gamboa Reservoir","Urrunaga Reservoir"]}},"2":{"d":{"es":"Un sector que se adentra hacia el norte de Navarra: Altsasu/Alsasua, la sierra de Urbasa y el trazado de la Vía Verde del Ferrocarril Vasco Navarro.","eu":"Nafarroaranzko sektorea: Altsasu, Urbasako mendilerroa eta Euskal-Nafar Trenbidearen Bide Berdearen ibilbidea.","en":"A sector that heads into Navarre: Altsasu/Alsasua, the Sierra de Urbasa and the route of the Basque-Navarrese Railway Greenway."},"see":{"es":["Altsasu/Alsasua","Sierra de Urbasa (Parque Natural Urbasa-Andía)","Vía Verde del Ferrocarril Vasco Navarro"],"eu":["Altsasu","Urbasako mendilerroa (Urbasa-Andia Natura Parkea)","Euskal-Nafar Trenbidearen Bide Berdea"],"en":["Altsasu/Alsasua","Sierra de Urbasa (Urbasa-Andía Natural Park)","Basque-Navarrese Railway Greenway"]}},"3":{"d":{"es":"El sector más largo de los cinco: combina la zona de Santa Cruz de Campezo con la Rioja Alavesa y la Vía Verde del Ferrocarril Vasco Navarro, entre viñedos y pueblos con historia.","eu":"Bost sektoreetan luzeena: Santikurutze Kanpezuko inguruak, Arabako Errioxa eta Euskal-Nafar Trenbidearen Bide Berdea biltzen ditu, mahastien eta historia handiko herrien artean.","en":"The longest of the five sectors: it combines the Santa Cruz de Campezo area with the Rioja Alavesa and the Basque-Navarrese Railway Greenway, among vineyards and villages full of history."},"see":{"es":["Santa Cruz de Campezo","Laguardia y sus bodegas","Rioja Alavesa y Sierra de Cantabria","Vía Verde del Ferrocarril Vasco Navarro"],"eu":["Santikurutze Kanpezu","Biasteri eta bertako upeltegiak","Arabako Errioxa eta Kantabriako mendilerroa","Euskal-Nafar Trenbidearen Bide Berdea"],"en":["Santa Cruz de Campezo","Laguardia and its wineries","Rioja Alavesa and the Sierra de Cantabria","Basque-Navarrese Railway Greenway"]}},"4":{"d":{"es":"El sector con más desnivel de los cinco. Recorre la Rioja, Miranda de Ebro y el Condado de Treviño, el enclave burgalés dentro de Álava.","eu":"Bost sektoreetan desnibel gehien duena. Errioxatik, Mirandatik eta Trebiñuko Konderritik igarotzen da, Arabaren barruan dagoen Burgosko enklabetik.","en":"The sector with the most climbing of the five. It runs through La Rioja, Miranda de Ebro and the Condado de Treviño, the enclave of Burgos inside Álava."},"see":{"es":["Miranda de Ebro y el río Ebro","Condado de Treviño","Viñedos y paisajes riojanos"],"eu":["Miranda de Ebro eta Ebro ibaia","Trebiñuko Konderria","Mahastiak eta Errioxako paisaiak"],"en":["Miranda de Ebro and the River Ebro","Condado de Treviño","Vineyards and Riojan landscapes"]}},"5":{"d":{"es":"Une las Salinas de Añana con Miranda de Ebro y se acerca al Salto del Nervión, uno de los saltos de agua más espectaculares del norte peninsular.","eu":"Gesaltza Añana Mirandarekin lotzen du eta Nerbioiko ur-jauzira hurbiltzen da, Penintsula iparraldeko ur-jauzirik ikusgarrienetakoa.","en":"It links the Salinas de Añana with Miranda de Ebro and gets close to the Nervión waterfall, one of the most spectacular waterfalls in northern Spain."},"see":{"es":["Valle Salado de Añana","Miranda de Ebro","Salto del Nervión (mejor tras épocas de lluvia)"],"eu":["Añanako Gatz Harana","Miranda de Ebro","Nerbioiko ur-jauzia (euri-garaien ostean hobeto)"],"en":["Añana Salt Valley","Miranda de Ebro","Nervión waterfall (best after rainy spells)"]}}},"town":{"Vitoria-Gasteiz":{"es":"Vitoria-Gasteiz es la capital de Álava y de Euskadi, sede del Gobierno Vasco y del Parlamento, y el punto de salida y llegada de GRAVARABA500. Tiene unos 250.000 habitantes y es una ciudad llana, con carriles bici y muchas calles peatonales, rodeada por el Anillo Verde.\nSu casco histórico es la Almendra Medieval, un conjunto de calles concéntricas en lo alto de una colina, con nombres de antiguos gremios como Cuchillería, Zapatería o Herrería. Aquí están la Catedral de Santa María, conocida como la Catedral Vieja, de estilo gótico y que se visita con casco por las obras de restauración, y la Catedral Nueva de María Inmaculada, neogótica. La Plaza de la Virgen Blanca y la Plaza de España, de estilo neoclásico, son el corazón de la ciudad.\nOtros lugares interesantes son el museo Artium de arte contemporáneo, el parque de La Florida y los restos de la muralla. Las fiestas de La Blanca se celebran en agosto. Tiene todos los servicios, con estación de tren y autobuses, tiendas de bicicletas, alojamiento y una gran oferta de pintxos, así que es el mejor sitio para preparar el material antes de salir y para descansar al volver.","eu":"Gasteiz Arabako eta Euskadiko hiriburua da, Eusko Jaurlaritzaren eta Legebiltzarraren egoitza, eta GRAVARABA500-en irteera eta helmuga. 250.000 biztanle inguru ditu eta hiri laua da, bidegorriekin eta kale oinezko ugarirekin, Eraztun Berdeak inguratuta.\nBere alde zaharra Erdi Aroko Almendra da, muino baten gainean dauden kale kontzentrikoen multzoa, Cuchillería, Zapatería edo Herrería bezalako antzinako gremioen izenekin. Hemen dago Santa Maria Katedrala, Katedral Zaharra izenez ezaguna, gotikoa, berrikuntza-lanak direla eta kaskoa jantzita bisitatzen dena, eta Maria Immakulatuaren Katedral Berria, neogotikoa. Andre Maria Zuriaren plaza eta Espainia plaza, biak neoklasikoak, hiriaren bihotza dira.\nBeste ikusgarri batzuk dira Artium arte garaikideko museoa, Florida parkea eta harresiaren hondarrak. Andre Mariaren Zuriaren jaiak abuztuan ospatzen dira. Zerbitzu guztiak ditu, tren eta autobus geltokiarekin, bizikleta dendekin, ostatuekin eta pintxo aukera zabalarekin; beraz, irten aurretik materiala prestatzeko eta itzuli ondoren atseden hartzeko leku onena da.","en":"Vitoria-Gasteiz is the capital of Álava and of the Basque Country, home to the Basque Government and Parliament, and the start and finish of GRAVARABA500. It has around 250,000 inhabitants and is a flat city with cycle lanes and many pedestrian streets, surrounded by the Green Belt.\nIts old town is the Medieval Almond (Almendra Medieval), a set of concentric streets on top of a hill, with names of old guilds such as Cuchillería, Zapatería or Herrería. Here you will find the Cathedral of Santa María, known as the Old Cathedral, a Gothic building that is visited wearing a helmet because of the restoration works, and the neo-Gothic New Cathedral of María Inmaculada. The Plaza de la Virgen Blanca and the Plaza de España, both neoclassical, are the heart of the city.\nOther places worth visiting are the Artium contemporary art museum, La Florida park and the remains of the city wall. The La Blanca festivities take place in August. It has every service, with a railway and bus station, bike shops, accommodation and a huge choice of pintxos, so it is the best place to prepare your gear before setting off and to rest on your return."},"Villarreal de Álava":{"es":"Villarreal de Álava, conocida en euskera como Legutio, es la capital del municipio de Legutio, en la comarca de Gorbeialdea. Se asienta junto al embalse de Urrunaga, una de las grandes láminas de agua que abastecen a Vitoria-Gasteiz, y el municipio incluye los concejos de Elosu, Goiain, Urrunaga y Urbina. Con unos 1.800 habitantes, es un buen lugar para avituallarse antes de seguir rodando por los embalses.","eu":"Villarreal de Álava, euskaraz Legutio, Legutioko udalerriko hiriburua da, Gorbeialdea eskualdean. Urrunagako urtegiaren ondoan dago, Gasteizi ura ematen dioten urtegi handietako bat, eta udalerrian Elosu, Goiain, Urrunaga eta Urbina auzoak daude. 1.800 biztanle inguru ditu, eta urtegien ondotik jarraitu aurretik hornitzeko leku egokia da.","en":"Villarreal de Álava, known in Basque as Legutio, is the capital of the municipality of Legutio, in the Gorbeialdea region. It sits by the Urrunaga Reservoir, one of the large bodies of water that supply Vitoria-Gasteiz, and the municipality includes the hamlets of Elosu, Goiain, Urrunaga and Urbina. With around 1,800 inhabitants, it is a good place to resupply before continuing along the reservoirs."},"Alegría-Dulantzi":{"es":"Alegría-Dulantzi está a unos 14 km al este de Vitoria-Gasteiz, en plena Llanada Alavesa. Su nombre medieval, Alegría, se eligió para atraer pobladores a la nueva villa, y aquí tuvo lugar en 1834 una batalla de la primera guerra carlista. Entre sus visitas destacan la iglesia de San Blas, la Casa de los Gaona, un pequeño puente de origen antiguo sobre el río, el Santuario de Nuestra Señora de Aiala, a un kilómetro del pueblo, y el castro de Henaio, un poblado fortificado de la Edad del Hierro con murallas, terrazas y una vista panorámica excelente. Cuenta con estación de tren y, en verano, un festival de teatro amateur.","eu":"Alegría-Dulantzi Gasteiztik 14 km ekialdera dago, Arabako Lautadaren erdian. Erdi Aroko izena, Alegría, hiribildu berrira biztanleak erakartzeko aukeratu zen, eta 1834an lehen gerra karlistako bataila bat izan zen hemen. Ikusgarrien artean daude San Blas eliza, Gaonatarren etxea, ibaiaren gaineko antzinako jatorriko zubi txiki bat, Aiala Andre Mariaren santutegia, herritik kilometro batera, eta Henaioko gaztelua, Burdin Aroko herrixka gotortua, harresiekin, terrazekin eta ikuspegi panoramiko bikainarekin. Tren geltokia du eta, udan, afizionatuen antzerki jaialdia.","en":"Alegría-Dulantzi lies about 14 km east of Vitoria-Gasteiz, right in the Llanada Alavesa plain. Its medieval name, Alegría, was chosen to attract settlers to the new town, and a battle of the First Carlist War took place here in 1834. Its sights include the church of San Blas, the Casa de los Gaona, a small bridge of ancient origin over the river, the Sanctuary of Nuestra Señora de Aiala, one kilometre from the village, and the Henaio hillfort, an Iron Age fortified settlement with walls, terraces and excellent panoramic views. It has a railway station and, in summer, an amateur theatre festival."},"Agurain/Salvatierra":{"es":"Agurain, Salvatierra en castellano, es una villa medieval de la Llanada Alavesa, a unos 29 km de Vitoria-Gasteiz, entre las sierras de Entzia e Iturrieta. Su casco histórico conserva soportales, restos de muralla y buena parte de su trazado medieval, con la iglesia de Santa María como referencia. A su alrededor hay yacimientos prehistóricos y los hayedos de la sierra de Entzia. Es una de las paradas más cómodas de la ruta, con servicios para comer y dormir.","eu":"Agurain, gaztelaniaz Salvatierra, Arabako Lautadako Erdi Aroko hiribildua da, Gasteiztik 29 km ingurura, Entzia eta Iturrieta mendilerroen artean. Alde zaharrak arkupeak, harresiaren hondarrak eta Erdi Aroko trazadura gordetzen ditu, Santa Maria eliza erreferentzia gisa. Inguruan historiaurreko aztarnategiak eta Entziako mendilerroko pagadiak daude. Ibilbideko geldialdirik erosoenetakoa da, jateko eta lo egiteko zerbitzuekin.","en":"Agurain, Salvatierra in Spanish, is a medieval town in the Llanada Alavesa, about 29 km from Vitoria-Gasteiz, between the Entzia and Iturrieta ranges. Its old town preserves arcades, remains of its walls and much of its medieval layout, with the church of Santa María as its landmark. Around it there are prehistoric sites and the beech woods of the Sierra de Entzia. It is one of the most comfortable stops on the route, with places to eat and sleep."},"Alsasua":{"es":"Altsasu (Alsasua) está en Navarra, en el valle de Sakana, junto al límite con Álava y Gipuzkoa. Es una localidad de unos 7.000 habitantes, antiguo nudo ferroviario, con comercios, bares, restaurantes y alojamiento. Es la puerta de entrada natural a la sierra de Urbasa y al Parque Natural Urbasa-Andía, de bosques de hayas y grandes praderas de altura que se recorren muy bien en gravel.","eu":"Altsasu (Alsasua) Nafarroan dago, Sakanako haranean, Arabarekin eta Gipuzkoarekin duen mugaren ondoan. 7.000 biztanle inguruko herria da, tren-lotunea izan zen lehen, eta dendak, tabernak, jatetxeak eta ostatuak ditu. Urbasako mendilerrorako eta Urbasa-Andia Natura Parkerako ate naturala da, pagadiekin eta altuerako larre handiekin, gravel bizikletaz oso ondo egiteko.","en":"Altsasu (Alsasua) is in Navarre, in the Sakana valley, next to the border with Álava and Gipuzkoa. It is a town of around 7,000 inhabitants and a former railway junction, with shops, bars, restaurants and accommodation. It is the natural gateway to the Sierra de Urbasa and the Urbasa-Andía Natural Park, with beech forests and large high-altitude meadows that are great to ride on a gravel bike."},"Maeztu":{"es":"Maeztu es una de las localidades principales del municipio de Arraia-Maeztu, en la Montaña Alavesa. Es un pueblo tranquilo, rodeado de monte y pastos, en una zona por la que discurre el trazado del antiguo Ferrocarril Vasco Navarro, hoy Vía Verde. Ofrece servicios básicos y es un buen punto de descanso antes de afrontar los tramos de montaña.","eu":"Maeztu Arraia-Maeztu udalerriko herri nagusietako bat da, Arabako Mendialdean. Herri lasaia da, mendiz eta larrez inguratua, antzinako Euskal-Nafar Trenbidea, gaur egun bide berdea, igarotzen den eremuan. Oinarrizko zerbitzuak eskaintzen ditu eta mendiko zatiei ekin aurretik atseden hartzeko leku ona da.","en":"Maeztu is one of the main villages of the municipality of Arraia-Maeztu, in the Montaña Alavesa. It is a quiet village surrounded by hills and pastures, in an area crossed by the route of the old Basque-Navarrese Railway, now a greenway. It offers basic services and is a good place to rest before tackling the mountain sections."},"Santa Cruz de Campezo":{"es":"Santa Cruz de Campezo (Santikurutze Kanpezu) es la capital del municipio de Campezo/Kanpezu, en la Montaña Alavesa y en el valle del río Ega. Está cerca del límite con Navarra, en el entorno de la Vía Verde del Ferrocarril Vasco Navarro, y es una de las localidades con más servicios de esta zona, con bares, comercios y alojamiento rural. Un buen lugar para pasar la noche antes o después de las sierras de Urbasa y Codés.","eu":"Santikurutze Kanpezu (Santa Cruz de Campezo) Kanpezu udalerriko hiriburua da, Arabako Mendialdean eta Ega ibaiaren haranean. Nafarroarekin duen mugatik gertu dago, Euskal-Nafar Trenbidearen Bide Berdearen inguruan, eta eremu honetako zerbitzu gehien dituzten herrietako bat da, tabernekin, dendekin eta nekazaritza-ostatuekin. Urbasa eta Codés mendilerroen aurretik edo ondoren gaua pasatzeko leku ona.","en":"Santa Cruz de Campezo (Santikurutze Kanpezu) is the capital of the municipality of Campezo/Kanpezu, in the Montaña Alavesa and in the valley of the River Ega. It is close to the border with Navarre, near the Basque-Navarrese Railway Greenway, and is one of the villages with the most services in this area, with bars, shops and rural accommodation. A good place to spend the night before or after the Urbasa and Codés ranges."},"Laguardia":{"es":"Laguardia es la villa medieval más meridional de Álava y la gran referencia de la Rioja Alavesa. Está rodeada de viñedos, custodiada por la Sierra de Cantabria y horadada por bodegas subterráneas. Conserva su trazado medieval, su muralla con varios torreones y la iglesia de Santa María de los Reyes, con una portada policromada del siglo XVII. Tiene mucha oferta de comida, alojamiento y catas de vino, aunque en temporada alta conviene reservar.","eu":"Biasteri (Laguardia) Arabako Erdi Aroko hiribildurik hegoaldekoena da eta Arabako Errioxaren erreferentzia nagusia. Mahastiz inguratuta dago, Kantabriako mendilerroak zainduta eta lur azpiko upeltegiz zulatuta. Bere Erdi Aroko trazadura, dorre ugaritako harresia eta Santa Maria Erregeena eliza gordetzen ditu, XVII. mendeko ate polikromatuarekin. Janari, ostatu eta ardo dastaketa aukera handia du, baina sasoi altuan aldez aurretik erreserbatzea komeni da.","en":"Laguardia is the southernmost medieval town in Álava and the great landmark of the Rioja Alavesa. It is surrounded by vineyards, guarded by the Sierra de Cantabria and riddled with underground wine cellars. It keeps its medieval layout, its walls with several towers and the church of Santa María de los Reyes, with a polychrome doorway from the 17th century. It offers plenty of food, accommodation and wine tastings, although in high season it is best to book ahead."},"Labastida":{"es":"Labastida (Bastida) es una villa de la Rioja Alavesa fundada en 1196, situada entre el río Ebro y la sierra de Toloño, cuya cima supera los 1.270 m. Su núcleo medieval nació sobre el cerro de la Mota, un lugar fronterizo con gran control visual sobre la comarca. Destacan la iglesia de Nuestra Señora de la Asunción, la plaza de la Paz, los palacios con blasones (unos 29 escudos heráldicos) y los lagares rupestres, doce de los cuales se pueden visitar. Tiene unos 1.500 habitantes y bodegas con visitas.","eu":"Bastida (Labastida) Arabako Errioxako hiribildua da, 1196an sortua, Ebro ibaiaren eta Toloñoko mendilerroaren artean, zeinaren gailurra 1.270 m baino gehiagokoa den. Erdi Aroko nukleoa Mota muinoan sortu zen, eskualdearen gaineko ikuspegi zabala duen muga-gune batean. Nabarmentzekoak dira Andre Mariaren Aszentsioa eliza, Bakearen plaza, armarridun jauregiak (29 armarri inguru) eta harrian zulatutako ardo-lakuak, hamabi bisita daitezkeenak. 1.500 biztanle inguru ditu eta bisitak eskaintzen dituzten upeltegiak.","en":"Labastida (Bastida) is a town in the Rioja Alavesa founded in 1196, between the River Ebro and the Sierra de Toloño, whose summit rises above 1,270 m. Its medieval core grew on the Mota hill, a frontier site with wide views over the region. Highlights are the church of Nuestra Señora de la Asunción, the Plaza de la Paz, the palaces with coats of arms (around 29 heraldic shields) and the rock-cut wine presses, twelve of which can be visited. It has about 1,500 inhabitants and wineries with visits."},"Haro":{"es":"Haro es la capital del vino de La Rioja Alta, a orillas del Ebro, justo en el límite con Álava. Su Barrio de la Estación reúne varias de las bodegas históricas más conocidas de Rioja, y su casco antiguo gira en torno a la plaza de la Paz, con el ayuntamiento barroco, y la iglesia de Santo Tomás. Cada 29 de junio celebra la Batalla del Vino. Es una ciudad con todo tipo de servicios y de las mejores paradas para pernoctar.","eu":"Haro Errioxa Garaiko ardoaren hiriburua da, Ebro ibaiaren ertzean, Arabarekin duen mugan bertan. Geltoki Auzoak Errioxako upeltegi historiko ezagunenetako batzuk biltzen ditu, eta alde zaharra Bakearen plazaren inguruan dago, udaletxe barrokoarekin, eta Santo Tomas elizaren inguruan. Urtero ekainaren 29an Ardoaren Bataila ospatzen du. Zerbitzu mota guztiak dituen hiria da eta gaua pasatzeko lekurik onenetakoa.","en":"Haro is the wine capital of La Rioja Alta, on the banks of the Ebro, right on the border with Álava. Its Barrio de la Estación (Station District) is home to some of the best-known historic wineries in Rioja, and its old town centres on the Plaza de la Paz, with the Baroque town hall, and the church of Santo Tomás. Every 29 June it celebrates the Battle of Wine. It is a city with every kind of service and one of the best places to spend the night."},"Peñacerrada-Urizaharra":{"es":"Peñacerrada-Urizaharra es una villa medieval de la Montaña Alavesa, a unos 28 km de Vitoria-Gasteiz, situada en un cruce de caminos entre los antiguos reinos de Navarra y Castilla. Conserva su casco histórico de trazado medieval, tramos de muralla, la Puerta Sur del siglo XV flanqueada por dos torreones y la Casa del Duque de Híjar. Tiene un museo etnográfico al aire libre con un molino de agua. Es un pueblo muy pequeño, con pocos servicios: conviene reservar alojamiento y llevar comida.","eu":"Peñacerrada-Urizaharra Arabako Mendialdeko Erdi Aroko hiribildua da, Gasteiztik 28 km ingurura, Nafarroako eta Gaztelako antzinako erreinuen arteko bidegurutze batean. Erdi Aroko alde zaharra, harresi-zatiak, XV. mendeko Hegoaldeko Atea, bi dorrez inguratua, eta Hijarko dukearen etxea gordetzen ditu. Aire zabaleko museo etnografikoa du, ur-errota batekin. Oso herri txikia da eta zerbitzu gutxi ditu: ostatua erreserbatzea eta janaria eramatea komeni da.","en":"Peñacerrada-Urizaharra is a medieval town in the Montaña Alavesa, about 28 km from Vitoria-Gasteiz, at a crossroads between the former kingdoms of Navarre and Castile. It keeps its medieval old town, stretches of wall, the 15th-century Puerta Sur flanked by two towers and the Casa del Duque de Híjar. It has an open-air ethnographic museum with a water mill. It is a very small village with few services: book accommodation and bring food."},"Pobes":{"es":"Pobes es la capital del municipio de Ribera Alta (Erriberagoitia), en la cuadrilla de Añana, a unos 550 m de altitud. El río Bayas atraviesa su zona baja y el pueblo se encuentra justo a la entrada de un desfiladero que lleva al valle de Cuartango. Es un pueblo pequeño, de unos 140 habitantes, con casas rurales como principal alojamiento. Queda a un pequeño desvío de la ruta.","eu":"Pobes Erriberagoitia (Ribera Alta) udalerriko hiriburua da, Añanako kuadrillan, itsas mailatik 550 m inguru. Bayas ibaia bere behealdetik igarotzen da eta herria Cuartangoko harana lotzen duen mihiztadura baten sarreran dago. 140 biztanle inguruko herri txikia da, nekazaritza-ostatuak ditu ostatu nagusi gisa. Ibilbidetik desbideratze txiki batera dago.","en":"Pobes is the capital of the municipality of Ribera Alta (Erriberagoitia), in the Añana district, at about 550 m above sea level. The River Bayas runs through its lower part and the village lies right at the entrance to a gorge leading to the Cuartango valley. It is a small village of about 140 inhabitants, with rural guesthouses as its main accommodation. It is a short detour from the route."},"Salinas de Añana":{"es":"Salinas de Añana alberga el Valle Salado, un sistema milenario de producción de sal en terrazas y eras de madera que sigue en uso y se puede visitar con guía. El valle y su entorno ofrecen, además de patrimonio, balneario y restaurantes. El pueblo es pequeño, pero tiene alojamiento y servicios turísticos, y es una de las paradas más singulares de toda la ruta.","eu":"Gesaltza Añana Gatz Haranaren herria da, egurrezko terrazetan eta gatz-ontzietan antolatutako antzinako gatz-ekoizpen sistema, gaur egun ere erabiltzen dena eta gidariarekin bisita daitekeena. Ondareaz gain, haranak eta inguruak bainuetxea eta jatetxeak eskaintzen dituzte. Herria txikia da, baina ostatua eta turismo zerbitzuak ditu, eta ibilbide osoko geldialdirik bereziena da.","en":"Salinas de Añana is home to the Salt Valley, an ancient salt production system on wooden terraces and pans that is still in use and can be visited with a guide. Besides heritage, the valley and its surroundings offer a spa and restaurants. The village is small but has accommodation and tourist services, and is one of the most unusual stops on the whole route."},"Miranda de Ebro":{"es":"Miranda de Ebro es una ciudad burgalesa a orillas del Ebro, histórico nudo ferroviario entre Castilla y el Cantábrico. Tiene casco antiguo con ambiente, paseo fluvial, castillo en lo alto y todos los servicios de una ciudad, con numerosos hoteles y restaurantes. Es la mejor opción de la ruta para pernoctar, reparar la bici o hacer una compra grande.","eu":"Miranda de Ebro Burgosko hiria da, Ebro ibaiaren ertzean, Gaztelaren eta Kantauri itsasoaren arteko tren-lotune historikoa. Alde zahar bizia, ibai-ertzeko pasealekua, muinoaren gaineko gaztelua eta hiri baten zerbitzu guztiak ditu, hotel eta jatetxe ugarirekin. Ibilbidean gaua pasatzeko, bizikleta konpontzeko edo erosketa handia egiteko aukerarik onena da.","en":"Miranda de Ebro is a city in Burgos on the banks of the Ebro, a historic railway junction between Castile and the Cantabrian coast. It has a lively old town, a riverside promenade, a castle on the hill and all the services of a city, with numerous hotels and restaurants. It is the best option on the route for spending the night, repairing your bike or doing a big shop."},"Berantevilla":{"es":"Berantevilla recibió el título de villa en 1299, por privilegio de Fernando IV, y su casco histórico está declarado conjunto monumental. Está a orillas del río Ayuda, en la cuadrilla de Añana y cerca de Miranda de Ebro. Destacan la iglesia parroquial de Nuestra Señora de la Asunción, las casas palaciegas con blasones, el área recreativa de Linares y un museo apícola. Cuenta con servicios básicos y queda a un pequeño desvío de la ruta.","eu":"Berantevillak hiribildu izendapena 1299an jaso zuen, Fernando IV.aren pribilegioz, eta bere alde historikoa monumentu-multzo izendatua dago. Ayuda ibaiaren ertzean dago, Añanako kuadrillan eta Mirandatik gertu. Nabarmentzekoak dira Andre Mariaren Aszentsioa parrokia, armarridun etxe jauntxoak, Linaresko aisialdi-gunea eta erlezaintza museo bat. Oinarrizko zerbitzuak ditu eta ibilbidetik desbideratze txiki batera dago.","en":"Berantevilla was granted town status in 1299 by a privilege of Ferdinand IV, and its historic centre is a declared monumental site. It lies on the banks of the River Ayuda, in the Añana district and near Miranda de Ebro. Highlights include the parish church of Nuestra Señora de la Asunción, the mansions with coats of arms, the Linares recreation area and a beekeeping museum. It has basic services and is a short detour from the route."},"Treviño":{"es":"El Condado de Treviño es un enclave de la provincia de Burgos rodeado por territorio alavés, con Treviño como capital. El paisaje es de cultivos de cereal y pueblos pequeños, entre la Llanada, la Montaña Alavesa y la Rioja Alavesa. Es un tramo tranquilo con poco tráfico y servicios básicos, útil para parar a comer o reponer agua.","eu":"Trebiñuko Konderria Burgosko probintziako enklabea da, Arabako lurraldeak inguratua, Trebiñu hiriburu duela. Paisaia ale-laboreena eta herri txikiena da, Lautadaren, Mendialdearen eta Arabako Errioxaren artean. Tarte lasaia da, trafiko gutxikoa eta oinarrizko zerbitzuekin, jateko edo ura hornitzeko gelditzeko baliagarria.","en":"The Condado de Treviño is an enclave of the province of Burgos surrounded by Álava territory, with Treviño as its capital. The landscape is one of cereal fields and small villages, between the Llanada, the Montaña Alavesa and the Rioja Alavesa. It is a quiet stretch with little traffic and basic services, useful for stopping to eat or fill up on water."},"Orduña":{"es":"Orduña (Urduña) es la única ciudad de Bizkaia, un enclave rodeado por Álava y Burgos que fue fundado en 1229 y gozó de gran importancia comercial como paso entre Castilla y el Cantábrico. Su casco histórico, declarado Conjunto Histórico-Monumental en 1997, conserva la Plaza de los Fueros, considerada la mayor plaza medieval de Euskadi, la Aduana neoclásica del siglo XVIII, el Portal Oscuro y buena parte de su muralla. En lo alto está el Santuario de la Antigua. Es el punto de partida habitual hacia el Salto del Nervión. Queda a unos 5 km de la ruta, así que hay que desviarse.","eu":"Urduña Bizkaiko hiri bakarra da, Arabak eta Burgosek inguratutako enklabea, 1229an sortua, eta Gaztelaren eta Kantauri itsasoaren arteko pasabide gisa merkataritza-garrantzi handia izan zuena. Bere alde zaharrak, 1997an Monumentu Multzo Historiko izendatuak, Foruen plaza gordetzen du, Euskadiko Erdi Aroko plazarik handiena dela uste dena, XVIII. mendeko Aduana neoklasikoa, Ate Iluna eta harresiaren zati handi bat. Gainean dago Antiguako santutegia. Nerbioiko ur-jauzira joateko ohiko abiapuntua da. Ibilbidetik 5 km ingurura dago; beraz, desbideratu egin behar da.","en":"Orduña (Urduña) is the only city in Bizkaia, an enclave surrounded by Álava and Burgos that was founded in 1229 and enjoyed great commercial importance as a pass between Castile and the Cantabrian coast. Its old town, declared a Historic-Monumental Site in 1997, preserves the Plaza de los Fueros, considered the largest medieval square in the Basque Country, the neoclassical 18th-century Customs House, the Portal Oscuro and much of its wall. Up on the hill is the Sanctuary of La Antigua. It is the usual starting point for the Nervión waterfall. It is about 5 km from the route, so you have to detour."}},"pois":{"Balsa de Caicedo (lago de Caicedo-Yuso y Arreo)":{"n":{"es":"Balsa de Caicedo (lago de Caicedo-Yuso y Arreo)","eu":"Caicedoko urmaela (Caicedo-Yusoko eta Arreoko aintzira)","en":"Caicedo Pond (Caicedo-Yuso and Arreo lake)"},"d":{"es":"La Balsa de Caicedo es el lago de Caicedo-Yuso y Arreo, en el municipio de Lantarón (Valles Alaveses), entre los pueblos de Caicedo-Yuso y Arreo y a unos 680 m de altitud. Es el único lago natural permanente del País Vasco y uno de los dos únicos lagos de la península ibérica formados sobre una chimenea salina.\nSu origen está en el diapiro de Añana, una masa de sal que asciende desde el subsuelo y hace brotar agua salada. Esa agua alimenta el lago y crea un ambiente muy particular: marismas salinas interiores con juncales marítimos, un hábitat que se esperaría ver cerca del mar, y una fauna propia, especialmente de aves y anfibios.\nEstá muy protegido. Es humedal Ramsar desde 2002 junto con el Valle Salado de Añana (26 ha en total, de las que el lago ocupa unas 13), Zona Especial de Conservación y parte del Biotopo Protegido del Diapiro de Añana. Se ha restaurado en los últimos años dentro del proyecto europeo Life Tremedal.\nEn su entorno hay una ermita, restos arqueológicos de lo que pudo ser un antiguo poblado y la leyenda del pueblo de «Lagus», que según la tradición estaba a orillas del lago. Está a pocos kilómetros de Salinas de Añana, así que combina muy bien con la visita al Valle Salado. Se llega por caminos y pistas parcelarias: conviene ir con calma y respetar la fauna.","eu":"Caicedoko urmaela Caicedo-Yusoko eta Arreoko aintzira da, Lantarón udalerrian (Arabako Haranak), Caicedo-Yuso eta Arreo herrien artean, itsas mailatik 680 m inguru. Euskal Herriko aintzira natural iraunkor bakarra da eta Iberiar Penintsulan gatz-tximinia baten gainean sortutako bi aintziretako bat.\nBere jatorria Añanako diapiroa da, azpiko lurretik igotzen den gatz-masa bat, ur gazia sorrarazten duena. Ur horrek aintzira elikatzen du eta ingurune oso berezia sortzen du: barnealdeko gatz-padurak, itsas ihiekin, normalean itsasoaren ondoan aurkituko genukeen habitata, eta fauna propioa, batez ere hegaztiak eta anfibioak.\nOso babestuta dago. 2002az geroztik Ramsar hezegunea da Añanako Gatz Harana ondoan (26 ha guztira, aintziraren 13 ha inguru), Kontserbazio Bereziko Eremua eta Añanako Diapiroaren Biotopo Babestuaren parte. Azken urteetan zaharberritu da Life Tremedal Europako proiektuaren barruan.\nInguruan ermita bat dago, antzinako herrixka baten izan zitekeen aztarna arkeologikoak eta «Lagus» herriaren kondaira, tradizioaren arabera aintziraren ertzean zegoena. Gesaltza Añanatik kilometro gutxira dago, beraz Gatz Haranera egindako bisitarekin oso ondo uztartzen da. Bideetatik eta nekazaritza-pistetatik iristen da: lasai joan eta faunari errespetua izan.","en":"The Balsa de Caicedo is the Caicedo-Yuso and Arreo lake, in the municipality of Lantarón (Valles Alaveses), between the villages of Caicedo-Yuso and Arreo and at about 680 m above sea level. It is the only permanent natural lake in the Basque Country and one of only two lakes in the Iberian Peninsula formed over a salt chimney.\nIts origin is the Añana diapir, a mass of salt rising from the subsoil that makes salt water well up. That water feeds the lake and creates a very special environment: inland salt marshes with maritime rushes, a habitat you would expect to find near the sea, and its own fauna, especially birds and amphibians.\nIt is highly protected. It has been a Ramsar wetland since 2002 together with the Añana Salt Valley (26 ha in total, of which the lake covers about 13), a Special Area of Conservation and part of the Añana Diapir Protected Biotope. It has been restored in recent years under the European Life Tremedal project.\nAround it there is a hermitage, archaeological remains of what may have been an ancient settlement and the legend of the village of «Lagus», which according to tradition stood on the lake shore. It is a few kilometres from Salinas de Añana, so it combines very well with a visit to the Salt Valley. You get there by tracks and farm roads: take your time and respect the wildlife."}},"Vía Verde del Ferrocarril Vasco Navarro":{"n":{"es":"Vía Verde del Ferrocarril Vasco Navarro","eu":"Euskal-Nafar Trenbidearen Bide Berdea","en":"Basque-Navarrese Railway Greenway"},"d":{"es":"La Vía Verde del Ferrocarril Vasco Navarro recupera el trazado del «Trenico», un tren de vía estrecha que unía Estella-Lizarra, en Navarra, con Bergara, en Gipuzkoa, pasando por Vitoria-Gasteiz. La línea Vitoria-Estella funcionó entre 1927 y 1967: el último tren circuló el 31 de diciembre de 1967. En total, la red del Vasco Navarro llegó a tener unos 140 km de vías.\nHoy el itinerario es un camino natural de más de 120 km que atraviesa cuatro comarcas: Tierra Estella en Navarra, la Montaña Alavesa y la Llanada Alavesa en Álava, y Debagoiena en Gipuzkoa. Conserva gran parte del patrimonio ferroviario, con unos doce túneles, viaductos y antiguas estaciones, y algunos túneles iluminados acogen recreaciones artísticas.\nEn la zona que recorremos en GRAVARABA500 hay varios puntos clave. En Antoñana, la antigua estación incluye un centro de interpretación en el muelle de mercancías, junto a tres vagones de Euskotren que hacen de oficina de turismo. La estación de Atauri está en proceso de rehabilitación. En Estíbaliz la vía conecta con la Ruta de la Llanada Alavesa, y en Vitoria-Gasteiz con la Vuelta al Anillo Verde.\nPara ir en gravel es un tramo cómodo: sin tráfico y con la pendiente suave propia de un antiguo tren de vía estrecha. Es un buen descanso entre tramos de monte, aunque conviene respetar a los paseantes y llevar luz si vas a cruzar túneles.","eu":"Euskal-Nafar Trenbidearen Bide Berdeak «Trenico»-aren ibilbidea berreskuratzen du, bide estuko tren bat, Nafarroako Lizarra eta Gipuzkoako Bergara lotzen zituena, Gasteiztik pasatuz. Gasteiz-Lizarra linea 1927 eta 1967 artean ibili zen: azken trena 1967ko abenduaren 31n ibili zen. Guztira, Euskal-Nafar sareak 140 km inguruko trenbidea izan zuen.\nGaur egun ibilbidea 120 km baino gehiagoko bide naturala da, lau eskualde zeharkatzen dituena: Nafarroako Lizarraldea, Arabako Mendialdea eta Lautada, eta Gipuzkoako Debagoiena. Trenbidearen ondare handia gordetzen du, hamabi tunel inguru, biaduktuak eta antzinako geltokiak, eta argiztatutako zenbait tunelek birsortze artistikoak hartzen dituzte.\nGRAVARABA500-n egiten dugun eremuan puntu garrantzitsu batzuk daude. Antoñanan, antzinako geltokiak interpretazio-zentro bat du salgaien kaian, Euskotren-en hiru bagoiren ondoan, turismo bulego gisa erabiltzen direnak. Atauriko geltokia zaharberritzen ari da. Estibalizen linea Arabako Lautadako Ibilbidearekin lotzen da, eta Gasteizen Eraztun Berdearen Itzulirekin.\nGravel bizikletaz tarte erosoa da: trafikorik gabea eta bide estuko tren zahar baten malda leunarekin. Mendiko zatien arteko atsedenaldi ona da, nahiz eta oinezkoei errespetua izan eta tuneletatik pasatzeko argia eraman behar den.","en":"The Basque-Navarrese Railway Greenway follows the route of the «Trenico», a narrow-gauge train that linked Estella-Lizarra, in Navarre, with Bergara, in Gipuzkoa, via Vitoria-Gasteiz. The Vitoria-Estella line ran between 1927 and 1967: the last train ran on 31 December 1967. In total, the Vasco Navarro network had about 140 km of track.\nToday the route is a walking and cycling path of more than 120 km crossing four regions: Tierra Estella in Navarre, the Montaña Alavesa and the Llanada Alavesa in Álava, and Debagoiena in Gipuzkoa. It keeps much of its railway heritage, with about twelve tunnels, viaducts and former stations, and some lit tunnels host artistic recreations.\nIn the area we cover on GRAVARABA500 there are several key points. At Antoñana, the old station includes an interpretation centre in the goods dock, next to three Euskotren carriages that serve as a tourist office. Atauri station is being restored. At Estíbaliz the line connects with the Llanada Alavesa Route, and in Vitoria-Gasteiz with the Green Belt Loop.\nOn a gravel bike it is a comfortable stretch: traffic-free and with the gentle gradient of a former narrow-gauge railway. It is a good rest between mountain sections, although you should respect walkers and carry a light if you are going through tunnels."}},"Ruta verde perimetral del embalse de Ullíbarri-Gamboa":{"n":{"es":"Ruta verde perimetral del embalse de Ullíbarri-Gamboa","eu":"Ullibarri-Ganboako urtegiaren inguruko bide berdea","en":"Ullíbarri-Gamboa Reservoir perimeter greenway"},"d":{"es":"La Ruta Verde del embalse de Ullíbarri-Gamboa rodea por completo el mayor embalse del País Vasco, el «mar interior» de Vitoria-Gasteiz. Tiene unos 45 km de perímetro (43,6 km según la ficha de Turismo Euskadi) y muy poco desnivel, entre 100 y 130 m acumulados según el trazado. Forma parte de la Red de Itinerarios Verdes de Álava y está completa desde que se terminó el tramo de la península de Urizar.\nPasa por los parques provinciales de Landa y Garaio, con sus playas interiores, por el Parque Ornitológico de Mendixur y por la pasarela flotante de Azúa. Las colas del embalse, al sur, son un humedal incluido en la lista Ramsar y un paraje clave para las aves migratorias, con observatorios para verlas.\nEl embalse abastece de agua a Vitoria-Gasteiz y a parte de Bizkaia. Hay versiones más cortas de la ruta: la ruta sur, o vuelta al humedal de las colas del embalse (unos 13 o 14 km, circular desde Garaio) y la ruta norte (unos 32 km desde Landa), muy usadas por familias.\nEn el sector 1 de GRAVARABA500 recorremos la mayor parte de este perímetro. No hace falta dar la vuelta entera: puedes parar en Landa o Garaio para comer, avituallarte o bañarte en verano, y en Garaio hay un punto de información.\nEn los meses de lluvia intensa puede estar muy húmeda, aunque es completamente ciclable.","eu":"Ullibarri-Ganboako urtegiaren Bide Berdeak Euskadiko urtegirik handiena inguratzen du, Gasteizko «barne-itsasoa». 45 km inguruko perimetroa du (43,6 km Euskadiko Turismoaren fitxaren arabera) eta oso desnibel gutxi, 100 eta 130 m bitartean metatuta, trazaduraren arabera. Arabako Ibilbide Berdeen Sarearen parte da eta Urizar penintsulako zatia amaitu zenetik osatuta dago.\nLanda eta Garaioko probintzia-parkeetatik pasatzen da, barruko hondartzekin, Mendixurreko Parke Ornitologikotik eta Azuako zubi flotagarritik. Urtegiaren isatsa, hegoaldean, Ramsar zerrendan sartutako hezegunea da eta hegazti migratzaileentzako gune funtsezkoa, haiek ikusteko behatokiekin.\nUrtegiak Gasteizi eta Bizkaiko zati bati ura ematen die. Ibilbidearen bertsio laburragoak daude: hegoaldeko ibilbidea, edo urtegiaren isatseko hezegunearen itzulia (13 edo 14 km inguru, Garaiotik zirkularra), eta iparraldeko ibilbidea (32 km inguru Landatik), familiek asko erabiltzen dutenak.\nGRAVARABA500-en 1. sektorean perimetro honen zati handiena egiten dugu. Ez da behar itzuli osoa egitea: Landan edo Garaion gelditu zaitezke jateko, hornitzeko edo udan bainatzeko, eta Garaion informazio-gunea dago.\nEuri handiko hilabeteetan oso hezea egon daiteke, baina erabat ibilgarria da bizikletaz.","en":"The Ullíbarri-Gamboa Reservoir Green Route circles the largest reservoir in the Basque Country, the «inland sea» of Vitoria-Gasteiz. It is about 45 km around (43.6 km according to the Euskadi Tourism listing) with very little climbing, between 100 and 130 m cumulative depending on the route. It is part of Álava's Green Routes Network and has been complete since the Urizar peninsula section was finished.\nIt passes through the provincial parks of Landa and Garaio, with their inland beaches, the Mendixur Ornithological Park and the floating walkway at Azúa. The tail end of the reservoir, to the south, is a wetland on the Ramsar list and a key site for migratory birds, with hides to watch them.\nThe reservoir supplies water to Vitoria-Gasteiz and part of Bizkaia. There are shorter versions of the route: the south route, or loop around the reservoir's tail wetland (about 13 or 14 km, circular from Garaio), and the north route (about 32 km from Landa), very popular with families.\nOn sector 1 of GRAVARABA500 we ride most of this perimeter. You don't need to do the whole loop: you can stop at Landa or Garaio to eat, resupply or swim in summer, and there is an information point at Garaio.\nIn months of heavy rain it can be very wet, although it is completely rideable."}},"Anillo Verde de Vitoria-Gasteiz":{"n":{"es":"Anillo Verde de Vitoria-Gasteiz","eu":"Gasteizko Eraztun Berdea","en":"Vitoria-Gasteiz Green Belt"},"d":{"es":"El Anillo Verde es el cinturón de parques periurbanos que rodea Vitoria-Gasteiz y uno de los grandes símbolos de la ciudad. Está formado por espacios de gran valor ecológico unidos por corredores naturales: Armentia, Olárizu, Salburua, Zabalgana, Zadorra y Errekaleor. Cumple ya más de 25 años y en 2021 recibió más de dos millones de visitas.\nLa Vuelta al Anillo Verde es un itinerario circular de unos 31 km (30,8 según Turismo Euskadi; algunas guías hablan de 33) por caminos afirmados, zonas peatonales y calzada, apto a pie y en bicicleta y accesible desde cualquier punto de la ciudad. La Vía Verde del Vasco Navarro conecta con él.\nSalburua (unas 196 ha) es el más conocido: un complejo de humedales con las balsas de Arkaute y Betoño, reconocido como humedal Ramsar, y Ataria, el centro de interpretación con vistas a las lagunas. Armentia (unas 165 ha) es un bosque de gran valor y una de las salidas más agradables hacia el sur. Olárizu (unas 30 ha) tiene el Jardín Botánico y praderas con hayas y miradores sobre la ciudad. Zabalgana (unas 45 ha) y el parque fluvial del Zadorra completan el anillo por el oeste y el norte.\nEs un recurso fundamental para la ruta: permite salir y volver a Vitoria-Gasteiz casi sin pisar asfalto, y funciona como calentamiento o paseo de recuperación. Recuerda que en estos parques los perros deben ir atados salvo en las zonas señalizadas.","eu":"Eraztun Berdea Gasteiz inguratzen duen hiri-inguruko parkeen gerrikoa da eta hiriaren sinbolo handietako bat. Balio ekologiko handiko eremuek osatzen dute, korridore naturalez lotuta: Armentia, Olarizu, Salburua, Zabalgana, Zadorra eta Errekaleor. 25 urte baino gehiago ditu eta 2021ean bi milioi bisita baino gehiago jaso zituen.\nEraztun Berdearen Itzulia 31 km inguruko ibilbide zirkularra da (30,8 km Euskadiko Turismoaren arabera; gida batzuek 33 diote), bide zorrotzetatik, oinezkoentzako guneetatik eta errepidetik, oinez eta bizikletaz egiteko egokia eta hiriko edozein punturik iristeko modukoa. Euskal-Nafar Trenbidearen Bide Berdea harekin lotzen da.\nSalburua (196 ha inguru) ezagunena da: hezeguneen multzoa Arkaute eta Betoñuko urmaelekin, Ramsar hezegune gisa aitortua, eta Ataria, aintziren ikuspegia duen interpretazio-zentroa. Armentia (165 ha inguru) balio handiko basoa da eta hegoalderako irteerarik atseginenetakoa. Olarizu (30 ha inguru) Lorategi Botanikoa du eta pagozko larreak, hiriaren gaineko mirailekin. Zabalgana (45 ha inguru) eta Zadorra ibai-parkea eraztuna osatzen dute mendebaldean eta iparraldean.\nIbilbiderako baliabide funtsezkoa da: Gasteizen irteteko eta itzultzeko aukera ematen du asfaltoa ia ukitu gabe, eta berotzeko edo errekuperazio-ibilaldi gisa balio du. Gogoratu parke hauetan txakurrek uhalarekin joan behar dutela, seinaleztatutako guneetan izan ezik.","en":"The Green Belt is the ring of peri-urban parks around Vitoria-Gasteiz and one of the city's great symbols. It is made up of spaces of great ecological value linked by natural corridors: Armentia, Olárizu, Salburua, Zabalgana, Zadorra and Errekaleor. It is now more than 25 years old and in 2021 it received more than two million visits.\nThe Green Belt Loop is a circular route of about 31 km (30.8 according to Euskadi Tourism; some guides say 33) on firm tracks, pedestrian areas and roads, suitable on foot and by bike and reachable from anywhere in the city. The Basque-Navarrese Railway Greenway connects to it.\nSalburua (about 196 ha) is the best known: a wetland complex with the Arkaute and Betoño ponds, recognised as a Ramsar wetland, and Ataria, the interpretation centre with views of the lagoons. Armentia (about 165 ha) is a woodland of great value and one of the most pleasant ways out to the south. Olárizu (about 30 ha) has the Botanical Garden and beech meadows with viewpoints over the city. Zabalgana (about 45 ha) and the Zadorra river park complete the ring in the west and north.\nIt is a key resource for the route: it lets you leave and return to Vitoria-Gasteiz almost without touching asphalt, and works as a warm-up or a recovery ride. Remember that in these parks dogs must be on a lead except in signposted areas."}},"Vitoria-Gasteiz, Green Capital":{"n":{"es":"Vitoria-Gasteiz, Green Capital","eu":"Gasteiz, Europako Hiriburu Berdea","en":"Vitoria-Gasteiz, Green Capital"},"d":{"es":"En 2012 Vitoria-Gasteiz fue European Green Capital (Capital Verde Europea), el título con el que la Comisión Europea reconoce a las ciudades más comprometidas con la sostenibilidad. Fue elegida el 21 de octubre de 2010 en Estocolmo, después de superar a otras once ciudades candidatas en la primera fase, y se convirtió en la primera ciudad española en lograrlo y la tercera de Europa, tras Estocolmo (2010) y Hamburgo (2011).\nFue también la primera ciudad de tamaño medio y del sur de Europa en recibir el galardón, con unos 240.000 habitantes. España tuvo que esperar hasta 2024 para tener una segunda ciudad con el título, Valencia.\nEl reconocimiento fue el resultado de décadas de política ambiental: el Anillo Verde, la peatonalización y la movilidad ciclista, el cuidado del espacio público y el compromiso ciudadano, que comenzó con la firma de la Carta de Aalborg. Después de 2012 la ciudad ha seguido sumando distinciones, como la certificación de Destino Turístico Sostenible en 2016 y el Global Green City Award de la ONU en 2019.\nPara el ciclista es una ciudad cómoda: llana, con carriles bici y calles peatonales, con el Anillo Verde a las puertas. Es un buen punto de salida y llegada de GRAVARABA500, y su casco medieval merece una visita antes o después de la ruta.","eu":"2012an Gasteiz Europako Hiriburu Berdea izan zen, Europako Batzordeak iraunkortasunean gehien konprometitutako hiriei aitortzen dien titulua. 2010eko urriaren 21ean aukeratu zuten Stockholmen, lehen fasean beste hamaika hiri hautagai gaindituta, eta lortzen zuen lehen hiri espainiarra eta Europako hirugarrena izan zen, Stockholm (2010) eta Hamburgoren (2011) ostean.\nSaria jasotzen zuen tamaina ertaineko eta Europako hegoaldeko lehen hiria ere izan zen, 240.000 biztanle inguruko. Espainiak 2024ra arte itxaron behar izan zuen titulua zuen bigarren hiri bat izateko, Valentzia.\nAitorpena hamarkadetako ingurumen-politikaren emaitza izan zen: Eraztun Berdea, oinezkotzea eta bizikleta bidezko mugikortasuna, espazio publikoaren zaintza eta herritarren konpromisoa, Aalborgeko Gutuna sinatzearekin hasi zena. 2012tik aurrera hiriak bereizgarriak batzen jarraitu du, besteak beste 2016ko Turismo Destino Jasangarri ziurtagiria eta NBEren Global Green City Award saria 2019an.\nTxirrindularientzat hiri erosoa da: laua, bidegorriekin eta oinezkoentzako kaleekin, eta Eraztun Berdea ateetan duela. GRAVARABA500-en irteera eta helmuga ona da, eta bere Erdi Aroko alde zaharra bisitatzea merezi du ibilbidea baino lehen edo ondoren.","en":"In 2012 Vitoria-Gasteiz was European Green Capital, the title with which the European Commission recognises the cities most committed to sustainability. It was chosen on 21 October 2010 in Stockholm, after beating eleven other candidate cities in the first phase, and became the first Spanish city to win it and the third in Europe, after Stockholm (2010) and Hamburg (2011).\nIt was also the first medium-sized and southern European city to receive the award, with around 240,000 inhabitants. Spain had to wait until 2024 for a second city with the title, Valencia.\nThe recognition was the result of decades of environmental policy: the Green Belt, pedestrianisation and cycling mobility, care of public space and citizen involvement, which began with the signing of the Aalborg Charter. After 2012 the city has continued to collect distinctions, such as the Sustainable Tourism Destination certification in 2016 and the UN Global Green City Award in 2019.\nFor cyclists it is a comfortable city: flat, with cycle lanes and pedestrian streets, and with the Green Belt on its doorstep. It is a good start and finish for GRAVARABA500, and its medieval old town is worth a visit before or after the ride."}},"Valle Salado de Añana":{"n":{"es":"Valle Salado de Añana","eu":"Añanako Gatz Harana","en":"Añana Salt Valley"},"d":{"es":"El Valle Salado de Añana, junto a Salinas de Añana, es una de las fábricas de sal más antiguas del mundo: allí se produce sal de forma ininterrumpida desde hace más de 6.500 años, según los datos que manejan distintas fuentes (se citan también 7.000). La sal se obtiene por evaporación solar en más de 5.000 eras, plataformas construidas en terrazas con piedra, arcilla y madera que cuelgan de la ladera.\nTodo nace de un manantial salado, la muera, que brota de una gran burbuja de sal de un antiguo mar de hace unos 200 millones de años. Es el mismo fenómeno geológico, un diapiro, que explica el lago de Caicedo-Yuso, a pocos kilómetros.\nTras siglos de explotación, en el siglo XX las salinas fueron cayendo en desuso; en los años 80 y 90 apenas quedaban unas 300 eras en funcionamiento. En 2009 se creó la Fundación Valle Salado de Añana, una entidad sin ánimo de lucro, para restaurarlo y mantenerlo. Hoy se han recuperado miles de eras y unas cuatrocientas producen sal, con cinco productos: Flor de Sal, Sal de Manantial, Chuzo de Sal, Sal Líquida y Sal Fina.\nRecibió el Gran Premio del Jurado de los premios Europa Nostra en 2015 y en 2017 la FAO lo reconoció como Sistema Importante del Patrimonio Agrícola Mundial, el primero de Europa. Se visita con guía (entre 1 y 1,5 horas, y más con taller de sal o cata), con reserva previa recomendada, desde el Centro de Visitantes de la calle Real, 32. Queda a unos 30 km de Vitoria-Gasteiz.","eu":"Añanako Gatz Harana, Gesaltza Añanaren ondoan, munduko gatz-fabrika zaharrenetako bat da: han 6.500 urte baino gehiagoz etenik gabe ekoizten da gatza, iturri desberdinen arabera (7.000 ere aipatzen dira). Gatza eguzki-lurrunketaz lortzen da 5.000 gatz-ontzi baino gehiagotan, harriz, buztinez eta egurrez terrazatan eraikitako plataformak, mazelatik zintzilik daudenak.\nDena gatz-iturri batetik sortzen da, muera, duela 200 milioi urte inguruko antzinako itsaso baten gatz-burbuila handi batetik ateratzen dena. Diapiro horrek, fenomeno geologiko berak, Caicedo-Yusoko aintzira azaltzen du, kilometro gutxira dagoena.\nMendez mende ustiatu ostean, XX. mendean gatz-ontziak erabiltzeari utzi zitzaizkion; 1980ko eta 1990eko hamarkadetan 300 gatz-ontzi inguru baino ez zeuden lanean. 2009an Añanako Gatz Harana Fundazioa sortu zen, irabazi-asmorik gabeko erakundea, zaharberritzeko eta mantentzeko. Gaur egun milaka gatz-ontzi berreskuratu dira eta lau ehun inguruk ekoizten dute gatza, bost produkturekin: Gatz-lorea, Iturri-gatza, Gatz-izotza, Gatz Likidoa eta Gatz Fina.\n2015ean Europa Nostra sarien Epaimahaiaren Sari Nagusia jaso zuen eta 2017an FAOk Munduko Nekazaritza Ondarearen Sistema Garrantzitsu gisa aitortu zuen, Europako lehena. Gidariarekin bisitatzen da (ordubete eta ordu bat eta erdi bitartean, gehiago gatz-tailerrarekin edo dastaketarekin), eta aldez aurretik erreserbatzea komeni da, Real kalea 32an dagoen Bisitarien Zentrotik. Gasteiztik 30 km ingurura dago.","en":"The Añana Salt Valley, next to Salinas de Añana, is one of the oldest salt factories in the world: salt has been produced there without interruption for more than 6,500 years, according to different sources (7,000 is also quoted). The salt is obtained by solar evaporation in more than 5,000 pans, platforms built in terraces with stone, clay and wood that hang from the hillside.\nIt all begins with a salt spring, the muera, which wells up from a great bubble of salt from an ancient sea about 200 million years old. It is the same geological phenomenon, a diapir, that explains the Caicedo-Yuso lake, a few kilometres away.\nAfter centuries of use, in the 20th century the salt pans fell into disuse; in the 1980s and 90s only around 300 pans were still working. In 2009 the Añana Salt Valley Foundation, a non-profit body, was created to restore and maintain it. Today thousands of pans have been recovered and about four hundred produce salt, with five products: Flor de Sal, Spring Salt, Salt Icicle, Liquid Salt and Fine Salt.\nIt won the Europa Nostra Grand Prix in 2015 and in 2017 the FAO recognised it as a Globally Important Agricultural Heritage System, the first in Europe. It is visited with a guide (between 1 and 1.5 hours, longer with a salt workshop or tasting), and booking ahead is recommended, from the Visitor Centre at 32 Calle Real. It is about 30 km from Vitoria-Gasteiz."}},"Salto del Nervión":{"n":{"es":"Salto del Nervión","eu":"Nerbioiko ur-jauzia","en":"Nervión Waterfall"},"d":{"es":"El Salto del Nervión es la cascada más alta de la Península Ibérica. Se encuentra en el Monumento Natural de Monte Santiago, en el límite entre Álava y Burgos, junto al puerto de Orduña y en plena Sierra Salvada. Las aguas del arroyo que forman los arroyos Iturrigutxi, Ajiturri y Urita se despeñan al cañón de Delika y, a partir de ahí, el río pasa a llamarse Nervión. Su caída vertical es de unos 220 m, aunque según cómo se mide se citan cifras de hasta 270 o 300 m, y destaca su forma de cola de caballo.\nNo siempre lleva agua: pasa buena parte del año seca, sobre todo en verano. El mejor momento es el invierno, la primavera y las épocas de lluvia o deshielo. Aun sin agua, merece la pena por el cortado y el cañón, donde anidan numerosas aves rapaces.\nSe puede ver desde arriba, en el Mirador del Nervión, al que se llega a pie por una pista de unos 2 km desde la Casa del Parque del Monte Santiago, y desde otros miradores como el del Castillete o el de la Esquina Rubén. También se puede ir desde Delika hasta el fondo del cañón, con una ruta fácil de unos 8 km ida y vuelta para ver la cascada desde abajo. Los cortados son verticales: no te acerques al borde.\nSegún las coordenadas, tu track pasa a pocos metros del fondo del cañón de Delika, así que la ruta te acerca a la base de la cascada. Comprueba en el mapa por dónde va exactamente.","eu":"Nerbioiko ur-jauzia Iberiar Penintsulako ur-jauzirik altuena da. Monte Santiagoko Monumentu Naturalean dago, Arabaren eta Burgosen arteko mugan, Urduñako mendatearen ondoan eta Salbada mendilerroaren erdian. Iturrigutxi, Ajiturri eta Urita erreken urak Delikako arroilara jausten dira eta, handik aurrera, ibaiari Nerbioi deitzen zaio. Jauzi bertikala 220 m ingurukoa da, nahiz eta nola neurtzen den arabera 270 edo 300 m arteko zifrak aipatzen diren, eta zaldi-buztanaren formagatik nabarmentzen da.\nEz du beti urik: urtearen zati handian lehor egoten da, batez ere udan. Garairik onena negua, udaberria eta euri edo urtze garaiak dira. Urik gabe ere merezi du labar eta arroilagatik, non harrapari hegazti asko habiaratzen diren.\nGoitik ikus daiteke, Nerbioiko Mirailean, Monte Santiagoko Parke Etxetik 2 km inguruko pista batetik oinez iristen dena, eta Castillete edo Esquina Rubén bezalako beste mirail batzuetatik. Delikatik ere joan zaitezke arroilaren hondoraino, 8 km inguruko joan-etorriko ibilbide errazarekin, ur-jauzia behetik ikusteko. Labarrak bertikalak dira: ez hurbildu ertzera.\nKoordenatuen arabera, zure trackak Delikako arroilaren hondotik metro gutxira pasatzen da, beraz ibilbideak ur-jauziaren oinarrira hurbiltzen zaitu. Egiaztatu mapan zehazki nondik doan.","en":"The Nervión Waterfall is the highest waterfall in the Iberian Peninsula. It lies in the Monte Santiago Natural Monument, on the border between Álava and Burgos, next to the Orduña pass and in the middle of the Sierra Salvada. The waters of the streams Iturrigutxi, Ajiturri and Urita plunge into the Delika canyon and, from there, the river is called the Nervión. Its vertical drop is about 220 m, although depending on how it is measured figures of up to 270 or 300 m are quoted, and it stands out for its horsetail shape.\nIt doesn't always have water: it is dry for much of the year, especially in summer. The best time is winter, spring and rainy or thaw periods. Even without water it is worth it for the cliff and the canyon, where many birds of prey nest.\nIt can be seen from above, at the Nervión Viewpoint, reached on foot along a track of about 2 km from the Monte Santiago Park House, and from other viewpoints such as El Castillete or Esquina Rubén. You can also walk from Delika to the bottom of the canyon, on an easy route of about 8 km round trip to see the waterfall from below. The cliffs are sheer: do not go near the edge.\nAccording to the coordinates, your track passes a few metres from the bottom of the Delika canyon, so the route brings you close to the base of the waterfall. Check on the map exactly where it goes."}},"Cascada de Gujuli (Goiuri)":{"n":{"es":"Cascada de Gujuli (Goiuri)","eu":"Gujuliko ur-jauzia (Goiuri)","en":"Gujuli (Goiuri) Waterfall"},"d":{"es":"La cascada de Gujuli, también llamada de Goiuri, está en el concejo de Gujuli, en el municipio de Urkabustaiz, en el límite del Parque Natural del Gorbeia y a unos 30 km al noroeste de Vitoria-Gasteiz. El río Oiardo, al que se unen los arroyos Basabe y Jaundia, cae desde más de 100 m de altura, lo que la convierte en una de las cascadas más altas de España.\nSe ve desde un mirador al que se llega con un paseo cómodo de unos 450 m desde el aparcamiento, unos 10 minutos a pie (900 m ida y vuelta). La entrada está señalizada en la carretera A-2521, en el trayecto entre el puerto de Altube y Orduña, poco antes de llegar a Goiuri. Desde el mirador también se ve el Gorbeia, que supera los 1.480 m.\nComo otras cascadas de la zona, lleva mucha agua en invierno y primavera, y en verano puede quedarse prácticamente seca. El entorno es de hayas, robles y avellanos, que en otoño cambia de color. En lo alto de la cascada está el barrio bajo de Goiuri, con una iglesia románica.\nLa leyenda cuenta que un pastor llamado Urjauzi derrochó la riqueza que le dio una lamia y ella lo convirtió en la cascada, cuyo nombre en euskera significa precisamente eso, cascada. Cerca están la cascada de Altube, el hayedo de Otzarreta y el santuario de Nuestra Señora de Oro. La oficina de turismo de la Cuadrilla de Zuia está en Murgia.","eu":"Gujuliko ur-jauzia, Goiuri ere deitua, Gujuli kontzejuan dago, Urkabustaiz udalerrian, Gorbeia Natura Parkearen mugan eta Gasteiztik 30 km ipar-mendebaldera. Oiardo ibaiak, Basabe eta Jaundia errekekin batera, 100 m baino gehiagotik erortzen da, eta Espainiako ur-jauzirik altuenetako bat bihurtzen du.\nAparkalekutik 450 m inguruko ibilaldi erosoz iristen den mirail batetik ikusten da, hamar minutu inguru oinez (900 m joan-etorrian). Sarrera A-2521 errepidean seinaleztatuta dago, Altube mendatetik Urduñarako bidean, Goiuri baino pixka bat lehenago. Mirailetik Gorbeia ere ikusten da, 1.480 m baino gehiagokoa.\nInguruko beste ur-jauzien modura, ur asko darama neguan eta udaberrian, eta udan ia lehor gera daiteke. Ingurua pago, haritz eta urritz basoz osatua dago, udazkenean kolorez aldatzen direnak. Ur-jauziaren goialdean Goiuriko auzo behea dago, eliza erromanikoarekin.\nKondairak dio Urjauzi izeneko artzain batek lamia batek emandako aberastasuna xahutu zuela eta hark ur-jauzi bihurtu zuela, zeinaren izenak euskaraz hori bera esan nahi duen, ur-jauzia. Inguruan daude Altubeko ur-jauzia, Otzarretako pagadia eta Oroko Andre Mariaren santutegia. Zuiako kuadrillako turismo bulegoa Murgian dago.","en":"The Gujuli waterfall, also called Goiuri, is in the hamlet of Gujuli, in the municipality of Urkabustaiz, on the edge of the Gorbeia Natural Park and about 30 km north-west of Vitoria-Gasteiz. The River Oiardo, joined by the streams Basabe and Jaundia, falls from more than 100 m, making it one of the highest waterfalls in Spain.\nIt is seen from a viewpoint reached by an easy walk of about 450 m from the car park, about 10 minutes on foot (900 m round trip). The entrance is signposted on the A-2521 road, on the way from the Altube pass to Orduña, shortly before Goiuri. From the viewpoint you can also see Gorbeia, which is over 1,480 m high.\nLike other waterfalls in the area, it carries a lot of water in winter and spring, and in summer it can be almost dry. The surroundings are beech, oak and hazel woods, which change colour in autumn. At the top of the waterfall is the lower quarter of Goiuri, with a Romanesque church.\nLegend has it that a shepherd called Urjauzi squandered the riches given to him by a lamia and she turned him into the waterfall, whose name in Basque means precisely that, waterfall. Nearby are the Altube waterfall, the Otzarreta beech wood and the Sanctuary of Nuestra Señora de Oro. The tourist office of the Zuia district is in Murgia."}},"Torre de los Varona":{"n":{"es":"Torre de los Varona","eu":"Varonatarren dorrea","en":"Varona Tower"},"d":{"es":"La Torre-Palacio de los Varona está en Villanañe, concejo de Valdegovía, en la Cuadrilla de Añana, y es considerada el conjunto fortificado mejor conservado de Álava. Es Bien de Interés Cultural desde 1984. La torre, de arquitectura militar del siglo XIV, se levantó sobre otra anterior, y en el siglo XV se le añadió el palacio, de estilo gótico renacentista.\nLa historia de la torre está unida a la de la familia que la habita. El linaje de los Varona se remonta, según la tradición, al siglo VII, y es uno de los pocos casos de familias nobles españolas que han vivido de forma continuada en el mismo lugar desde el siglo XV. El conjunto está restaurado y convertido en museo, y recrea la vida en el palacio.\nLa visita es siempre guiada y la organiza la Oficina de Turismo de Valdegovía (945 35 30 40). En julio y agosto abre de martes a sábado de 11:00 a 14:00 y de 16:00 a 19:00, y los domingos y festivos de 11:00 a 14:00, con cierre los lunes y la última visita una hora antes. Fuera de esas fechas, confirma el horario. Hay aparcamiento gratuito.\nJunto a la torre está la iglesia de la Asunción, del siglo XVI, y en el pueblo, de unos 110 habitantes, se encuentran también el templo parroquial de Santa María y el Santuario de Nuestra Señora de Angosto. Villanañe queda a pocos kilómetros del Parque Natural de Valderejo.","eu":"Varonatarren dorre-jauregia Villanañen dago, Valdegovía (Gaubea) haraneko kontzejua, Añanako kuadrillan, eta Arabako gotorleku-multzorik hobekien kontserbatutzat jotzen da. Kultur Intereseko Ondasuna da 1984tik. XIV. mendeko arkitektura militarreko dorrea aurreko baten gainean eraiki zen, eta XV. mendean jauregia gehitu zitzaion, gotiko-errenazentista estilokoa.\nDorrearen historia bertan bizi den familiarenarekin lotuta dago. Varonatarren leinua, tradizioaren arabera, VII. mendera arte doa, eta XV. mendetik leku berean etenik gabe bizi izan diren Espainiako familia noble gutxietako bat da. Multzoa zaharberrituta eta museo bihurtuta dago, eta jauregiko bizimodua birsortzen du.\nBisita beti gidatua da eta Valdegoviako Turismo Bulegoak antolatzen du (945 35 30 40). Uztailean eta abuztuan asteartetik larunbatera 11:00etatik 14:00etara eta 16:00etatik 19:00etara irekita dago, eta igandetan eta jaiegunetan 11:00etatik 14:00etara, astelehenetan itxita eta azken bisita ixtea baino ordubete lehenago. Data horietatik kanpo, egiaztatu ordutegia. Doako aparkalekua dago.\nDorrearen ondoan Aszentsioa eliza dago, XVI. mendekoa, eta herrian, 110 biztanle ingurukoa, Santa Maria parrokia eta Angostoko Andre Mariaren santutegia ere badaude. Villanañe Valderejo Natura Parketik kilometro gutxira dago.","en":"The Varona Tower-Palace is in Villanañe, a hamlet of Valdegovía, in the Añana district, and is considered the best preserved fortified complex in Álava. It has been a Site of Cultural Interest since 1984. The tower, of 14th-century military architecture, was built on top of an earlier one, and in the 15th century the palace was added, in Gothic-Renaissance style.\nThe history of the tower is linked to that of the family that lives in it. The Varona lineage goes back, according to tradition, to the 7th century, and it is one of the few cases of Spanish noble families who have lived continuously in the same place since the 15th century. The complex has been restored and turned into a museum, and recreates life in the palace.\nThe visit is always guided and is organised by the Valdegovía Tourist Office (945 35 30 40). In July and August it is open Tuesday to Saturday from 11:00 to 14:00 and from 16:00 to 19:00, and on Sundays and holidays from 11:00 to 14:00, closed on Mondays and with the last visit one hour before closing. Outside those dates, check the opening hours. There is free parking.\nNext to the tower is the church of La Asunción, from the 16th century, and in the village, of about 110 inhabitants, you will also find the parish church of Santa María and the Sanctuary of Nuestra Señora de Angosto. Villanañe is a few kilometres from the Valderejo Natural Park."}},"Santuario y Virgen de Dorleta (patrona de los ciclistas)":{"n":{"es":"Santuario y Virgen de Dorleta (patrona de los ciclistas)","eu":"Dorletako Amaren santutegia (txirrindularien zaindaria)","en":"Dorleta Sanctuary (patron of cyclists)"},"d":{"es":"El Santuario de Nuestra Señora de Dorleta está en Leintz-Gatzaga (Gipuzkoa), muy cerca del puerto de Arlaban, en lo alto de un pequeño promontorio. Aunque pertenece a Gipuzkoa, tu track pasa a unos pocos cientos de metros, así que es una parada sencilla en el sector 1. Es uno de los emblemas de la localidad y la Virgen de Dorleta es la patrona de los ciclistas.\nLa proclamación como patrona de los ciclistas se produjo el 28 de agosto de 1960, después de una petición respaldada por el obispo de Donostia y por las federaciones de ciclismo vascas y españolas. En 1958 un comité de aficionados cicloturistas ya había impulsado la coronación de la Virgen en la explanada del santuario. Es una parada tradicional para los ciclistas que cruzan el puerto de Arlaban.\nHasta 1331, año en que la villa recibió su carta puebla, el santuario fue la parroquia de Leintz-Gatzaga, y también sirvió de hospedería del Camino de Santiago. La imagen actual, una talla gótica de los siglos XIII a XVI según la ficha de Turismo Euskadi (otras fuentes la sitúan en los siglos XIII y XIV), muestra a la Virgen y al Niño mirándose. El edificio actual es del siglo XVII.\nHay área recreativa con merendero, aparcamiento y parque, y se pueden hacer visitas guiadas. De mayo a octubre se celebra misa los domingos a las 12:30, excepto el primer fin de semana de julio. Cerca está el Museo de la Sal de Gatzaga.","eu":"Dorletako Andre Mariaren santutegia Leintz-Gatzagan dago (Gipuzkoa), Arlabango mendatetik oso gertu, promontorio txiki baten gainean. Gipuzkoakoa izan arren, zure trackak ehunka metrora pasatzen da; beraz, 1. sektoreko geldialdi erraza da. Herriaren ikurretako bat da eta Dorletako Ama txirrindularien zaindaria da.\n1960ko abuztuaren 28an proklamatu zuten txirrindularien zaindari, Donostiako gotzainak eta euskal eta espainiar txirrindularitza federazioek babestutako eskaera baten ondoren. 1958an zikloturismo-zale talde batek Ama koroatzea sustatu zuen santutegiaren zabalgunean. Arlabango mendatea zeharkatzen duten txirrindularientzako ohiko geldialdia da.\n1331. urtera arte, hiribilduak foru-gutuna jaso zuen urtera arte, santutegia Leintz-Gatzagako parrokia izan zen, eta Done Jakue Bidearen ostatu ere izan zen. Egungo irudia, Euskadiko Turismoaren fitxaren arabera XIII. eta XVI. mendeen arteko irudi gotikoa (beste iturri batzuek XIII. eta XIV. mendeetan kokatzen dute), Ama eta Haurra elkarri begira agertzen dira. Egungo eraikina XVII. mendekoa da.\nAisialdi-gunea, aparkalekua eta parkea ditu, eta bisita gidatuak egin daitezke. Maiatzetik urrira meza ospatzen da igandetan 12:30ean, uztaileko lehen asteburuan izan ezik. Gatzagako Gatzaren Museoa ondoan dago.","en":"The Sanctuary of Our Lady of Dorleta is in Leintz-Gatzaga (Gipuzkoa), very close to the Arlaban pass, on top of a small promontory. Although it belongs to Gipuzkoa, your track passes a few hundred metres away, so it is an easy stop on sector 1. It is one of the emblems of the village and the Virgin of Dorleta is the patron saint of cyclists.\nShe was proclaimed patron of cyclists on 28 August 1960, after a petition backed by the Bishop of Donostia and by the Basque and Spanish cycling federations. In 1958 a committee of cycle-touring enthusiasts had already promoted the crowning of the Virgin on the esplanade of the sanctuary. It is a traditional stop for cyclists crossing the Arlaban pass.\nUntil 1331, the year the town received its charter, the sanctuary was the parish church of Leintz-Gatzaga, and it also served as a hostel on the Camino de Santiago. The current image, a Gothic carving from the 13th to 16th centuries according to the Euskadi Tourism listing (other sources place it in the 13th and 14th centuries), shows the Virgin and Child gazing at each other. The present building dates from the 17th century.\nThere is a picnic area, car park and park, and guided visits are possible. From May to October mass is held on Sundays at 12:30, except on the first weekend of July. The Salt Museum of Gatzaga is nearby."}},"Bodegas Ysios (Santiago Calatrava)":{"n":{"es":"Bodegas Ysios (Santiago Calatrava)","eu":"Ysios upeltegia (Santiago Calatrava)","en":"Ysios Winery (Santiago Calatrava)"},"d":{"es":"Bodegas Ysios está a unos 2 km al norte de Laguardia, al pie de la sierra de Cantabria. Se inauguró en 2001 y el edificio es obra del arquitecto Santiago Calatrava, que lo concibió como un «templo dedicado al vino». Tu track pasa muy cerca de la bodega, en el sector 3.\nSu cubierta ondulada de aluminio, apoyada en una fachada de madera de cedro, reproduce la silueta de la sierra de Cantabria que se ve detrás. Calatrava se inspiró en una hilera de barricas, y vista desde arriba la bodega recuerda a una copa de vino. El nombre, Ysios, rinde homenaje a Isis y Osiris. Se dice que luce especialmente de noche, cuando la luz sale del interior.\nForma, junto con Viña Real, el dúo de bodegas de arquitectura espectacular de Laguardia. Ofrece visitas guiadas, de unos 90 minutos en la versión básica, por el edificio, el viñedo, la nave de barricas y la sala de catas, y terminan con una cata de sus vinos, en español, inglés y francés. Conviene reservar con antelación. Está en la carretera Camino de la Hoya, en Laguardia.\nPara el ciclista, está a pocos minutos de Laguardia, así que combina bien con una parada para comer o dormir en el pueblo.","eu":"Ysios upeltegia Biasteritik 2 km iparraldera dago, Kantabriako mendilerroaren magalean. 2001ean inauguratu zen eta eraikina Santiago Calatrava arkitektoaren lana da, «ardoari eskainitako tenplu» gisa sortu zuena. Zure trackak upeltegitik oso gertu pasatzen da, 3. sektorean.\nAluminiozko estalki uhindua, zedro-egurrezko fatxada baten gainean, atzean ikusten den Kantabriako mendilerroaren silueta errepikatzen du. Calatravak upel-ilara batean aurkitu zuen inspirazioa, eta goitik begiratuta upeltegiak ardo-kopa baten itxura du. Ysios izenak Isis eta Osirisi egiten die omenaldia. Gauez bereziki ederra dela diote, barnetik argia ateratzen denean.\nViña Realekin batera, Biasteriko arkitektura ikusgarriko bi upeltegiak osatzen dituzte. Bisita gidatuak eskaintzen ditu, oinarrizko bertsioan 90 minutu ingurukoak, eraikinean, mahastian, upel-areagoan eta dastatze-gelan zehar, eta bere ardoen dastaketarekin amaitzen dira, gaztelaniaz, ingelesez eta frantsesez. Aldez aurretik erreserbatzea komeni da. Hoya bidean dago, Biasterin.\nTxirrindularientzat Biasteritik minutu gutxira dago; beraz, herrian jateko edo lo egiteko geldialdi batekin ondo uztartzen da.","en":"Bodegas Ysios is about 2 km north of Laguardia, at the foot of the Sierra de Cantabria. It opened in 2001 and the building is the work of architect Santiago Calatrava, who conceived it as a «temple dedicated to wine». Your track passes very close to the winery, on sector 3.\nIts undulating aluminium roof, resting on a cedar-wood façade, reproduces the silhouette of the Sierra de Cantabria seen behind it. Calatrava was inspired by a row of barrels, and seen from above the winery resembles a wine glass. The name, Ysios, pays homage to Isis and Osiris. It is said to look especially good at night, when light spills out from the inside.\nTogether with Viña Real, it forms Laguardia's pair of wineries with spectacular architecture. It offers guided visits, about 90 minutes in the basic version, through the building, the vineyard, the barrel hall and the tasting room, ending with a tasting of its wines, in Spanish, English and French. Booking ahead is advisable. It is on the Camino de la Hoya road, in Laguardia.\nFor cyclists, it is a few minutes from Laguardia, so it combines well with a stop to eat or sleep in the town."}}},"poiMeta":[{"k":"Balsa de Caicedo (lago de Caicedo-Yuso y Arreo)","c":"poi","la":42.77981,"lo":-2.989864,"long":1,"nodv":1},{"k":"Vía Verde del Ferrocarril Vasco Navarro","c":"poi","la":42.805365,"lo":-2.45904,"long":1,"nodv":1},{"k":"Ruta verde perimetral del embalse de Ullíbarri-Gamboa","c":"poi","la":42.9378,"lo":-2.5654,"long":1,"nodv":1},{"k":"Anillo Verde de Vitoria-Gasteiz","c":"poi","la":42.8645,"lo":-2.6524,"long":1,"nodv":1},{"k":"Vitoria-Gasteiz, Green Capital","c":"poi","la":42.8467,"lo":-2.6716,"long":1,"nodv":1},{"k":"Valle Salado de Añana","c":"poi","la":42.804,"lo":-2.9855,"long":1},{"k":"Salto del Nervión","c":"poi","la":42.939,"lo":-2.9813,"long":1},{"k":"Cascada de Gujuli (Goiuri)","c":"poi","la":42.9735,"lo":-2.9101,"long":1},{"k":"Torre de los Varona","c":"poi","la":42.8297,"lo":-3.0716,"long":1},{"k":"Santuario y Virgen de Dorleta (patrona de los ciclistas)","c":"poi","la":42.9822,"lo":-2.5655,"long":1},{"k":"Bodegas Ysios (Santiago Calatrava)","c":"poi","la":42.5742,"lo":-2.5943,"long":1}]};
