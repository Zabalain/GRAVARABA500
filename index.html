<div class="days">${s.days.map((d,j)=>`<div class="dayc" style="--c:${COL[j%10]}">${dprof(d,COL[j%10])}<div class="dh"><span><span class="dot" style="background:${COL[j%10]}"></span><b>${t('th_day')} ${j+1}</b></span><button class="btn s" onclick="dlDay(${j})">GPX</button></div><div class="dl">${PNm(d.from)} → ${PNm(d.to)}${d.dvTo>0.5?' '+t('dv_inline',f1(d.dvTo)):''}</div><div class="dst"><div><b>${f0(d.km)}</b><span>km</span></div><div><b>${f0(d.asc)}</b><span>m+</span></div><div><b>${f1(d.h)}</b><span>h</span></div></div></div>`).join('')}</div>
<button class="btn" onclick="dlAll()">${t('btn_all')}</button><button class="btn o s" onclick="pick(${i});document.getElementById('ruta').scrollIntoView()">${t('btn_map')}</button>`;
if(!draw)return;sel=s;showRoute(0,{plan:true,nofit:true});lay.clearLayers();
s.days.forEach((d,j)=>{L.polyline(segW(d.k1,d.k2).map(p=>[p[0],p[1]]),{color:COL[j%10],weight:6}).addTo(lay);const p=atW(d.k2);if(j<s.n-1)L.marker([p[0],p[1]],{icon:L.divIcon({className:'',html:`<div class="mk" style="background:${COL[j%10]}">${j+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(lay).bindTooltip(t('tip_dayend',j+1,PNm(d.to),f0(d.k2>TOT?d.k2-TOT:d.k2)))});
map.fitBounds(L.polyline(segW(s.a,s.b).map(p=>[p[0],p[1]])).getBounds(),{padding:[30,30]})}
function gpx(name,pts){return `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="GRAVARABA500" xmlns="http://www.topografix.com/GPX/1.1"><trk><name>${name}</name><trkseg>${pts.map(p=>`<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}"><ele>${Math.round(p[2])}</ele></trkpt>`).join('')}</trkseg></trk></gpx>`}
function save(n,x){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/gpx+xml'}));a.download=n+'.gpx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function dayPts(j){const s=PL,d=s.days[j];return segW(d.k1,d.k2)}
function dlDay(j){save(`GRAVARABA500_D${j+1}`,gpx(`GRAVARABA500 D${j+1}`,dayPts(j)))}
function dlAll(){save(`GRAVARABA500_${Math.round(PL.a%TOT)}-${Math.round(PL.b%TOT)}`,gpx(`GRAVARABA500 km ${Math.round(PL.a%TOT)}-${Math.round(PL.b%TOT)}`,PL.days.flatMap((d,j)=>dayPts(j))))}
// Controles
const U={days:['#vD','v_days'],mk:['#vK','v_km'],mh:['#vH','v_h'],ma:['#vA','v_a']};
function vals(){for(const k in U)$(U[k][0]).textContent=t(U[k][1],k==='ma'?f0(+$('#'+k).value):+$('#'+k).value)}
for(const k in U)$('#'+k).addEventListener('input',()=>{vals();hint();render()});
$('#lvl').addEventListener('change',()=>render());$('#start').addEventListener('change',()=>render());
function hint(){$('#xhint').style.display=(+$('#mk').value>=400||+$('#mh').value>=18||+$('#days').value<=3&&+$('#mk').value>=250)?'block':'none'}
// Descargas
function buildDl(){$('#dl').innerHTML=ROUTES.map(r=>`<div class="dlr"><span class="dot" style="background:${r.col}"></span><div><b>${r.id?r.id+' · ':''}${rn(r)}</b><small>${f0(r.tot)} km · ${f0(r.asc)} m+</small></div><a class="btn s" href="tracks/${r.file}" download>GPX</a></div>`).join('')}
// POIs
const mkI=c=>L.divIcon({className:'',html:`<div style="font-size:20px;filter:drop-shadow(0 1px 2px #0008)">${CATS[c]}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
POIS.forEach(p=>{const q=nearKm(p.la,p.lo);p.km=q.km;p.dist=q.d;p.m=L.marker([p.la,p.lo],{icon:mkI(p.c)}).addTo(map).bindPopup('')});
POIS.sort((a,b)=>(b.long?1:0)-(a.long?1:0)||a.km-b.km);
function popups(){POIS.forEach(p=>p.m.setPopupContent(`<b>${pname(p)}</b><br>${(pdesc(p)||'').split('\n')[0]}`))}
// ===== Imágenes (Wikimedia Commons, solo licencias libres) =====
// La página busca en Wikimedia Commons una foto turística de cada sitio y solo la muestra si su licencia es libre (CC BY, CC BY-SA, CC0 o dominio público);
// descarta banderas, escudos, mapas y logos, y muestra siempre autor y licencia. Para fijar una foto concreta: IMG_PIN['Haro']={file:'Nombre del archivo.jpg',credit:'Autor · licencia'};
// para usar una foto propia: IMG_OVERRIDE['Haro']={src:'img/haro.jpg',credit:'Foto: tu nombre'}. La clave es el nombre en castellano del sitio.
const IMG_OVERRIDE={};
const IMG_PIN={'Laguardia':{file:'Guardia airetik2.jpg',credit:'Mikel Arrazola · CC BY 3.0'}};
const IMG_Q={
'Vitoria-Gasteiz':'Vitoria-Gasteiz Plaza de la Virgen Blanca','Villarreal de Álava':'Legutio Urrunaga embalse','Alegría-Dulantzi':'Alegría-Dulantzi','Agurain/Salvatierra':'Salvatierra Agurain casco histórico','Alsasua':'Alsasua Altsasu',
'Maeztu':'Maeztu Álava','Santa Cruz de Campezo':'Santa Cruz de Campezo','Labastida':'Labastida Álava','Haro':'Haro La Rioja Barrio de la Estación bodegas','Peñacerrada-Urizaharra':'Peñacerrada-Urizaharra muralla',
'Pobes':'Pobes Ribera Alta Álava','Salinas de Añana':'Salinas de Añana Valle Salado','Miranda de Ebro':'Miranda de Ebro casco antiguo','Berantevilla':'Berantevilla','Treviño':'Treviño Burgos condado','Orduña':'Orduña Plaza de los Fueros',
'Balsa de Caicedo (lago de Caicedo-Yuso y Arreo)':'Lago de Caicedo-Yuso Arreo','Vía Verde del Ferrocarril Vasco Navarro':'Vía Verde Ferrocarril Vasco Navarro túnel','Ruta verde perimetral del embalse de Ullíbarri-Gamboa':'Embalse de Ullíbarri-Gamboa',
'Anillo Verde de Vitoria-Gasteiz':'Anillo Verde Vitoria Salburua humedales','Vitoria-Gasteiz, Green Capital':'Vitoria-Gasteiz Parque de la Florida','Valle Salado de Añana':'Valle Salado de Añana salinas','Salto del Nervión':'Salto del Nervión cascada',
'Cascada de Gujuli (Goiuri)':'Cascada de Gujuli','Torre de los Varona':'Torre de los Varona Villanañe','Santuario y Virgen de Dorleta (patrona de los ciclistas)':'Santuario de Dorleta Leintz-Gatzaga','Bodegas Ysios (Santiago Calatrava)':'Bodegas Ysios Laguardia Calatrava'};
const IMGC={},FREE=/CC[ -]?BY|CC0|public domain|\bPD\b/i,BAD=/flag|bandera|escudo|coat[ _]of|\bmap|mapa|logo|locator|location|situaci|plano|diagram|cartel|poster|placa|panel|portrait|retrato|firma|signature|banner|vector/i;
const strip=h=>(h||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
async function commonsFind(q){try{const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=15&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiextmetadatafilter=LicenseShortName|Artist&iiurlwidth=640';
 const o=await (await fetch(u)).json();const ps=Object.values((o.query&&o.query.pages)||{}).sort((a,b)=>a.index-b.index);
 for(const p of ps){const i=p.imageinfo&&p.imageinfo[0];if(!i||i.mime!=='image/jpeg'||i.width<1200)continue;const ra=i.width/i.height;if(ra<1.15||ra>2.4||BAD.test(p.title))continue;
  const m=i.extmetadata||{},lic=strip((m.LicenseShortName||{}).value);if(!FREE.test(lic))continue;const art=strip((m.Artist||{}).value).slice(0,40);
  return{src:i.thumburl,page:i.descriptionurl,credit:(art?art+' · ':'')+lic}}}catch(e){}return null}
function getImg(p){const key=p.k||(typeof p.n==='string'?p.n:LX(p.n)),ov=IMG_OVERRIDE[key];if(ov)return Promise.resolve(ov);
 const pin=IMG_PIN[key];if(pin)return Promise.resolve({src:'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(pin.file)+'?width=640',page:'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(pin.file.replace(/ /g,'_')),credit:pin.credit});
 if(!IMGC[key]){let c=null;try{c=JSON.parse(localStorage.getItem('gi2:'+key))}catch(e){}IMGC[key]=c?Promise.resolve(c):commonsFind(IMG_Q[key]||key).then(r=>{if(r)try{localStorage.setItem('gi2:'+key,JSON.stringify(r))}catch(e){}return r})}return IMGC[key]}
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let Q='';
function loadImgs(){document.querySelectorAll('#pois .pimg').forEach(el=>{const p=POIS[+el.dataset.p],em=CATS[p.c];getImg(p).then(r=>{if(!r)return;el.innerHTML=`<img src="${r.src}" alt="${pname(p).replace(/"/g,'')}" loading="lazy" onerror="this.parentNode.textContent='${em}'">${r.page?`<a href="${r.page}" target="_blank" rel="noopener">📷 ${r.credit}</a>`:(r.credit?`<span>📷 ${r.credit}</span>`:'')}`;
 const th=document.querySelector(`#pois .th[data-p="${el.dataset.p}"]`);if(th)th.innerHTML=`<img src="${r.src}" alt="" loading="lazy" onerror="this.remove()">`})})}
let tab='poi';
function tabs(){$('#tabs').innerHTML=Object.keys(CATS).map(c=>`<button class="tab ${c===tab&&!Q?'on':''}" onclick="Q='';$('#q').value='';tab='${c}';tabs()">${CATS[c]} ${t('cat_'+c)}</button>`).join('');
const l=Q?POIS.filter(p=>norm(pname(p)).includes(Q)):POIS.filter(p=>p.c===tab);
$('#pois').innerHTML=l.length?l.map(p=>{const i=POIS.indexOf(p),dv=p.dist>0.5&&!p.nodv;return `<div class="card poi acc${p.long?' wide':''}"><button class="ah" onclick="togglePoi(this)" aria-expanded="false"><span class="th" data-p="${i}">${CATS[p.c]}</span><span class="ht"><b>${pname(p)}</b><small>${t('poi_km',f0(p.km))}${dv?' · ⚠️ '+f1(p.dist)+' km':''}</small></span><span class="chev">▾</span></button><div class="ab"><div class="pimg" data-p="${i}">${CATS[p.c]}</div>${dv?`<div class="dv">${t('dv_poi',f1(p.dist),f1(p.dist*2))}</div>`:''}${(pdesc(p)||'').split('\n').map(x=>`<p>${x}</p>`).join('')}<button class="btn s" onclick="goPoi(${i})">${t('btn_map')}</button></div></div>`}).join(''):(Q?`<div class="card" style="grid-column:1/-1">${t('no_res')}</div>`:`<div class="card" style="grid-column:1/-1">${t('empty',t('cat_'+tab).toLowerCase(),tab)}</div>`);loadImgs()}
function togglePoi(b){const c=b.parentNode,o=c.classList.contains('open');document.querySelectorAll('#pois .acc.open').forEach(e=>{e.classList.remove('open');e.querySelector('.ah').setAttribute('aria-expanded','false')});if(!o){c.classList.add('open');b.setAttribute('aria-expanded','true');setTimeout(()=>c.scrollIntoView({block:'nearest',behavior:'smooth'}),60)}}
function goPoi(i){const p=POIS[i];document.getElementById('ruta').scrollIntoView();map.setView([p.la,p.lo],14);p.m.openPopup()}
// ===== Idioma =====
function applyStatic(){document.documentElement.lang=LG;document.title=t('page_title');const md=document.querySelector('meta[name=description]');if(md)md.content=t('meta_desc');
 document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=t(e.dataset.i)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});const up=$('#up');if(up)up.setAttribute('aria-label',t('up_lbl'));
 document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===LG));
 fillStart();mStart.unbindTooltip();mStart.bindTooltip(t('start_tip'));stats();vals()}
function setLang(l){if(!LANGS.includes(l))return;LG=l;try{localStorage.setItem('gl',l)}catch(e){}
 applyStatic();buildDl();popups();tabs();
 const was=sel,idx=Math.max(0,cands.indexOf(PL));
 if(!was)showRoute(CR.id,{nofit:true});
 if(cands.length)pick(idx,!!was);else render(false);if(was)chips()}
document.querySelectorAll('.lg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
$('#q').addEventListener('input',e=>{Q=norm(e.target.value.trim());tabs()});const upb=$('#up');upb.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',()=>{upb.style.display=scrollY>900?'flex':'none'},{passive:true});
buildStops();applyStatic();buildDl();popups();tabs();showRoute(0);hint();render(false);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{profile();map.invalidateSize()},200)});

</script>
